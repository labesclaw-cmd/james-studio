<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>網站更新申請表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft JhengHei',Arial,sans-serif;background:#f5f5f5;padding:24px;font-size:14px}
.wrap{max-width:600px;margin:0 auto;background:#fff;padding:32px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
h2{color:#1a3a2e;font-size:18px;margin-bottom:6px}
.order-tag{font-size:12px;color:#888;margin-bottom:24px}
.form-group{margin-bottom:18px}
label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px;color:#333}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid #ccc;border-radius:4px;font-size:13px;font-family:inherit}
textarea{resize:vertical}
button{background:#1a3a2e;color:#fff;border:none;padding:12px 28px;border-radius:4px;cursor:pointer;font-size:14px;font-weight:bold;margin-top:4px}
button:hover{background:#2a5a4e}
button:disabled{background:#999;cursor:not-allowed}
#msg{display:none;margin-top:20px;padding:14px;background:#e8f5e9;border-radius:4px;font-size:13px;color:#1a3a2e}
#msg.error{background:#fdecea;color:#c00}
</style>
</head>
<body>
<div class="wrap">
  <h2 id="page-title">網站更新申請</h2>
  <p class="order-tag" id="order-tag"></p>

  <form id="form">
    <div class="form-group">
      <label>聯絡人姓名 <span style="color:#c00">*</span></label>
      <input name="contact_name" required placeholder="您的稱呼">
    </div>
    <div class="form-group">
      <label>LINE ID</label>
      <input name="line_id" placeholder="@xxxxx">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input name="email" type="email" placeholder="方便回覆的信箱">
    </div>
    <div class="form-group">
      <label>更新項目說明 <span style="color:#c00">*</span></label>
      <textarea name="update_description" rows="5" required placeholder="請詳細描述需要更新或修改的內容，例如：更換首頁圖片、修改公告文字、新增社群連結…"></textarea>
    </div>
    <div class="form-group">
      <label>素材說明</label>
      <textarea name="material_notes" rows="3" placeholder="如有圖片、文字檔或其他素材，請說明提供方式（例：LINE 傳圖、Google Drive 連結…）"></textarea>
    </div>
    <div class="form-group">
      <label>預計完成時間需求</label>
      <select name="deadline">
        <option value="盡快">盡快</option>
        <option value="1週內">1 週內</option>
        <option value="2週內">2 週內</option>
        <option value="1個月內">1 個月內</option>
      </select>
    </div>
    <button type="submit" id="submit-btn">送出申請</button>
  </form>

  <div id="msg"></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzslTIMvgXJs7gHKDS4YP76cySUyOv7mSsThVyp5289QMqXoo3SfbDjuaA0HW3vLajy/exec';

const params = new URLSearchParams(window.location.search);
const orderNum = params.get('order') || '';

if (orderNum) {
  document.getElementById('order-tag').textContent = '訂單編號：' + orderNum;
  document.title = orderNum + '｜更新申請表';
  document.getElementById('page-title').textContent = orderNum + '｜網站更新申請';
}

document.getElementById('form').addEventListener('submit', function(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '傳送中…';

  const d = { form_type: 'update', order_num: orderNum, submitted_at: new Date().toLocaleString('zh-TW') };
  new FormData(e.target).forEach(function(v, k) { d[k] = v; });

  fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(d) })
    .then(function(r) { return r.json(); })
    .then(function(r) {
      document.getElementById('form').style.display = 'none';
      const m = document.getElementById('msg');
      m.style.display = 'block';
      if (r.result === 'success') {
        m.textContent = '✅ 申請已送出！我們會盡快與您聯繫，謝謝。';
      } else {
        m.className = 'error';
        m.textContent = '❌ 送出失敗，請重試或以 LINE 聯繫我們。';
        document.getElementById('form').style.display = 'block';
        btn.disabled = false; btn.textContent = '重新送出';
      }
    })
    .catch(function() {
      const m = document.getElementById('msg');
      m.style.display = 'block'; m.className = 'error';
      m.textContent = '❌ 網路錯誤，請重試或以 LINE 聯繫我們。';
      document.getElementById('form').style.display = 'block';
      btn.disabled = false; btn.textContent = '重新送出';
    });
});
</script>
</body>
</html>
